#name: stopfloods

services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        APP_ENV: ${APP_ENV}
#    user: "${UID}:${GID}"
    env_file:
      - ./.env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/var/www/html:cached
    expose:
      - "9000"

  nginx:
    image: nginx:alpine
    env_file:
      - ./.env
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certbot/etc:/etc/letsencrypt:ro
      - ./docker/certbot/lib:/var/lib/letsencrypt:rw
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"

  mysql:
    image: mysql:${MYSQL_VERSION}
    env_file:
      - ./.env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${MYSQL_HOST_PORT}:3306"
    volumes:
      - dbdata80:/var/lib/mysql          # <— NEW volume for MySQL 8.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql57:
    image: mysql:5.7
    container_name: mysql57
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql           # <-- old 5.7 data
    ports:
      - "33061:3306"                    # avoid clash with 8.0 on 33060/3306
    
    
  certbot:
    image: certbot/certbot
    env_file:
      - ./.env
    volumes:
      - ./docker/certbot/etc:/etc/letsencrypt
      - ./docker/certbot/lib:/var/lib/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew; done"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    depends_on:
      - mysql
    env_file:
      - ./.env
    environment:
      PMA_HOST: mysql
      PMA_PORT: ${DB_PORT}
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    restart: always

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:delegated
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HOST: "0.0.0.0"
    command: sh -lc "npm install && npm run dev -- --host"  # optional

volumes:
  dbdata: {}     # old 5.7 data (unchanged, for rollback)
  dbdata80: {}   # new 8.0 data
  node_modules:

